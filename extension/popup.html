<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>XDM Turbo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      padding: 14px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 22px;
      height: 22px;
      background: #10b981;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #000;
      font-size: 13px;
    }
    .title {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.3px;
    }
    .status-badge {
      font-size: 10px;
      font-family: monospace;
      padding: 2px 7px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-online {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-offline {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .card {
      background: #121826;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .video-detected {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .video-name {
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      line-height: 1.3;
      word-break: break-word;
    }
    select {
      width: 100%;
      background: #090d16;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
      outline: none;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      background: #10b981;
      color: #000000;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #34d399;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .footer-link {
      display: block;
      text-align: center;
      color: #64748b;
      font-size: 11px;
      text-decoration: none;
      margin-top: 10px;
      cursor: pointer;
    }
    .footer-link:hover {
      color: #94a3b8;
    }
    .alokpoth-foot {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 10px;
      color: #64748b;
      text-decoration: none;
      cursor: pointer;
    }
    .alokpoth-foot:hover {
      color: #cbd5e1;
    }
    .alokpoth-foot img {
      width: 11px;
      height: 11px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#ffffff" stroke="#ffffff" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      <div class="title">XDM Turbo</div>
    </div>
    <div id="statusBadge" class="status-badge status-offline">
      <span class="dot"></span>
      <span id="statusText">Connecting...</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Media Sniffer</div>
    <div id="videoSection" class="video-detected">
      <div id="videoTitle" class="video-name">Checking active tab for video streams...</div>
      
      <select id="qualitySelect">
        <option value="best">Best Quality (Auto Max)</option>
        <option value="bestvideo[height<=2160][fps>=50]+bestaudio/bestvideo[height<=2160]+bestaudio/best">4K Ultra HD (2160p)</option>
        <option value="bestvideo[height<=1440][fps>=50]+bestaudio/bestvideo[height<=1440]+bestaudio/best">2K QHD (1440p)</option>
        <option value="bestvideo[height<=1080]+bestaudio/best[height<=1080]">1080p Full HD</option>
        <option value="bestvideo[height<=720]+bestaudio/best[height<=720]">720p HD</option>
        <option value="bestvideo[height<=480]+bestaudio/best[height<=480]">480p Standard</option>
        <option value="bestaudio/best">Audio Only (MP3)</option>
      </select>

      <button id="downloadBtn" class="btn">
        <span>Download Video with XDM</span>
      </button>
    </div>
  </div>

  <a id="openXdmBtn" class="footer-link">Open XDM Desktop Dashboard →</a>
  <a id="alokpothBtn" class="alokpoth-foot" title="Alokpoth Ecosystem">
    <span>from</span>
    <img src="icons/alokpoth-icon-dark.png" alt="Alokpoth">
    <strong style="color:#cbd5e1;font-weight:700;">Alokpoth</strong>
    <span>• আলোকপথ</span>
  </a>

  <script src="popup.js"></script>
</body>
</html>
